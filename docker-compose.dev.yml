# Development database. The app itself runs on your machine with `yarn dev`
# (hot reload), and connects to this Postgres on localhost:5432.
#
#   yarn dev       # starts this database, applies migrations, then the app
#                  # (via the predev script); http://localhost:3000
#   yarn db:down   # stop the database (data is kept)
#
# Its own project name, so it never shares a database with docker-compose.yml.

name: chessalyze-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Fixed dev credentials: the port is only reachable from this machine.
      POSTGRES_USER: chessalyze
      POSTGRES_PASSWORD: chessalyze
      POSTGRES_DB: chessalyze
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `up --wait` (yarn db:up) return only once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessalyze -d chessalyze"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
